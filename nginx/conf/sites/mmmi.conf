# MMMI Portfolio Monitor  ->  https://itv21.informatik.htw-dresden.de/mmmi/
#
# The app has no login of its own and shows private student portfolios,
# so every request must pass Basic Auth.
# Upstream: container "mmmi-monitor" on the shared Docker network "proxy".

location = /mmmi {
    return 301 /mmmi/;
}

location /mmmi/ {
    auth_basic           "MMMI Monitor";
    auth_basic_user_file /etc/nginx/conf.d/htpasswd/mmmi;

    # Resolve the container name per request via Docker's DNS. With a fixed
    # hostname nginx would refuse to start (taking down ALL sites) whenever
    # the monitor container is not running.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $mmmi_upstream http://mmmi-monitor:5000;

    rewrite ^/mmmi/(.*)$ /$1 break;
    proxy_pass $mmmi_upstream;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Prefix /mmmi;

    # First overview load queries GitLab for every student
    proxy_read_timeout 180s;

    # Do not pass the Basic Auth credentials on to the app
    proxy_set_header Authorization "";

    add_header X-Robots-Tag           "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "no-referrer" always;
}
